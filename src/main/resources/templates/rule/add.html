<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>添加规则</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>添加规则</h2>
            <a th:href="@{/rule/list}" class="btn btn-secondary">返回列表</a>
        </div>

        <form id="ruleForm" class="form">
            <div class="form-group">
                <label>规则名称 <span class="required">*</span></label>
                <input type="text" name="ruleName" required class="form-control" placeholder="如：完成作业、考试满分等">
            </div>

            <div class="form-group">
                <label>规则描述</label>
                <textarea name="ruleDesc" class="form-control" rows="3" placeholder="详细说明该规则的具体要求"></textarea>
            </div>

            <div class="form-group">
                <label>规则类型 <span class="required">*</span></label>
                <select name="ruleType" required class="form-control">
                    <option value="">请选择</option>
                    <option value="ADD">加分规则</option>
                    <option value="DEDUCT">扣分规则</option>
                </select>
            </div>

            <div class="form-group">
                <label>积分数值 <span class="required">*</span></label>
                <input type="number" name="pointValue" required class="form-control" min="1" placeholder="输入积分值（正整数）">
            </div>

            <div class="form-group">
                <label>规则分类</label>
                <select name="category" class="form-control">
                    <option value="学习类">学习类</option>
                    <option value="家务类">家务类</option>
                    <option value="行为习惯类">行为习惯类</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label>适用对象 <span class="required">*</span></label>
                <select name="applyTo" required class="form-control">
                    <option value="">请选择</option>
                    <option value="PARENT">家长</option>
                    <option value="CHILD">小朋友</option>
                    <option value="ALL">通用</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <a th:href="@{/rule/list}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $('#ruleForm').on('submit', function(e) {
            e.preventDefault();
            var formData = $(this).serialize();

            $.ajax({
                url: '/rule/save',
                type: 'POST',
                data: formData,
                success: function(res) {
                    if (res.code === 200) {
                        alert('保存成功');
                        window.location.href = '/rule/list';
                    } else {
                        alert(res.message);
                    }
                },
                error: function() {
                    alert('操作失败，请稍后重试');
                }
            });
        });
    </script>
</body>
</html>
