<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>家庭成员管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>家庭成员管理</h2>
            <div class="actions">
                <a th:href="@{/member/add}" class="btn btn-primary">添加成员</a>
                <a th:href="@{/member/ranking}" class="btn btn-info">积分排行榜</a>
                <a th:href="@{/}" class="btn btn-secondary">返回首页</a>
            </div>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>头像</th>
                    <th>姓名</th>
                    <th>角色</th>
                    <th>年龄</th>
                    <th>类型</th>
                    <th>当前积分</th>
                    <th>累计获得</th>
                    <th>累计消费</th>
                    <th>状态</th>
                    <th>加入日期</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member : ${members}">
                    <td>
                        <img th:if="${member.avatar}" th:src="@{'/upload' + ${member.avatar}}" class="avatar" alt="头像">
                        <span th:unless="${member.avatar}">-</span>
                    </td>
                    <td th:text="${member.name}"></td>
                    <td th:text="${member.role}"></td>
                    <td th:text="${member.age != null ? member.age : '-'}"></td>
                    <td>
                        <span th:if="${member.memberType == 'PARENT'}" class="badge badge-info">家长</span>
                        <span th:if="${member.memberType == 'CHILD'}" class="badge badge-warning">小朋友</span>
                    </td>
                    <td class="text-bold" th:text="${member.currentPoints}"></td>
                    <td th:text="${member.totalEarnedPoints}"></td>
                    <td th:text="${member.totalSpentPoints}"></td>
                    <td>
                        <span th:if="${member.status == 1}" class="badge badge-success">启用</span>
                        <span th:if="${member.status == 0}" class="badge badge-danger">停用</span>
                    </td>
                    <td th:text="${#temporals.format(member.joinDate, 'yyyy-MM-dd')}"></td>
                    <td>
                        <a th:href="@{/member/edit/{id}(id=${member.id})}" class="btn-link">编辑</a>
                        <a href="javascript:void(0);" th:onclick="'toggleStatus(' + ${member.id} + ',' + ${member.status} + ')'" class="btn-link">
                            <span th:if="${member.status == 1}">停用</span>
                            <span th:if="${member.status == 0}">启用</span>
                        </a>
                        <a href="javascript:void(0);" th:onclick="'deleteMember(' + ${member.id} + ')'" class="btn-link text-danger">删除</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="11" class="text-center">暂无数据</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function toggleStatus(id, currentStatus) {
            var newStatus = currentStatus === 1 ? 0 : 1;
            var msg = newStatus === 1 ? '确定要启用该成员吗？' : '确定要停用该成员吗？';
            if (confirm(msg)) {
                $.ajax({
                    url: '/member/updateStatus/' + id,
                    type: 'POST',
                    data: { status: newStatus },
                    success: function(res) {
                        if (res.code === 200) {
                            alert('操作成功');
                            location.reload();
                        } else {
                            alert(res.message);
                        }
                    }
                });
            }
        }

        function deleteMember(id) {
            if (confirm('确定要删除该成员吗？删除后无法恢复！')) {
                $.ajax({
                    url: '/member/delete/' + id,
                    type: 'POST',
                    success: function(res) {
                        if (res.code === 200) {
                            alert('删除成功');
                            location.reload();
                        } else {
                            alert(res.message);
                        }
                    }
                });
            }
        }
    </script>
</body>
</html>
