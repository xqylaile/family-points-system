<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>添加成员</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>添加成员</h2>
            <a th:href="@{/member/list}" class="btn btn-secondary">返回列表</a>
        </div>

        <form id="memberForm" enctype="multipart/form-data" class="form">
            <div class="form-group">
                <label>姓名 <span class="required">*</span></label>
                <input type="text" name="name" required class="form-control">
            </div>

            <div class="form-group">
                <label>角色 <span class="required">*</span></label>
                <input type="text" name="role" required class="form-control" placeholder="如：爸爸、妈妈、孩子等">
            </div>

            <div class="form-group">
                <label>年龄</label>
                <input type="number" name="age" class="form-control" min="1" max="120">
            </div>

            <div class="form-group">
                <label>成员类型 <span class="required">*</span></label>
                <select name="memberType" required class="form-control">
                    <option value="">请选择</option>
                    <option value="PARENT">家长</option>
                    <option value="CHILD">小朋友</option>
                </select>
            </div>

            <div class="form-group">
                <label>头像</label>
                <input type="file" name="avatarFile" accept="image/*" class="form-control">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <a th:href="@{/member/list}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $('#memberForm').on('submit', function(e) {
            e.preventDefault();
            var formData = new FormData(this);

            $.ajax({
                url: '/member/save',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(res) {
                    if (res.code === 200) {
                        alert('保存成功');
                        window.location.href = '/member/list';
                    } else {
                        alert(res.message);
                    }
                },
                error: function() {
                    alert('操作失败，请稍后重试');
                }
            });
        });
    </script>
</body>
</html>
